---
- hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - infra.aap_configuration_extended
    - infra.aap_configuration

  vars:
    no_log: false
    aap_hostname: "https://aap.phat2.lab"
    aap_username: "admin"
    aap_password: "default_PASSWORD_8675309"
    aap_validate_certs: false

    oauth_app_name: "import-auto-app"
    token_file: "./aap-gateway-token.json"

    filetree_dir: "/home/exporttest/flatexport/"
    orgs: "Default"
    aap_validate_certs: false
    filetree_dir: "/home/exporttest/flatexport/"
    dir_orgs_vars: "{{ filetree_dir }}"
    orgs: "Default"

      #sadly, our flat dir must be massaged into vars
    filetree_controller_settings: "{{ filetree_dir }}"
    filetree_aap_organizations: "{{ filetree_dir }}"
    filetree_controller_labels: "{{ filetree_dir }}"
    filetree_aap_user_accounts: "{{ filetree_dir }}"
    filetree_aap_teams: "{{ filetree_dir }}"
    filetree_controller_credential_types: "{{ filetree_dir }}"
    filetree_controller_credentials: "{{ filetree_dir }}"
    filetree_controller_credential_input_sources: "{{ filetree_dir }}"
    filetree_controller_notifications: "{{ filetree_dir }}"
    filetree_controller_projects: "{{ filetree_dir }}"
    filetree_controller_execution_environments: "{{ filetree_dir }}"
    filetree_aap_applications: "{{ filetree_dir }}"
    filetree_controller_inventories: "{{ filetree_dir }}"
    filetree_controller_inventory_sources: "{{ filetree_dir }}"
    filetree_controller_instance_groups: "{{ filetree_dir }}"
    filetree_controller_hosts: "{{ filetree_dir }}"
    filetree_controller_groups: "{{ filetree_dir }}"
    filetree_controller_templates: "{{ filetree_dir }}"
    filetree_controller_workflow_job_templates: "{{ filetree_dir }}"
    filetree_controller_schedules: "{{ filetree_dir }}"
    filetree_controller_roles: "{{ filetree_dir }}"
      #file: /home/exporttest/flatexport/controller_job_templates.yaml

  tasks:
    # ----------------------------------------
    # Bootstrap / refresh Gateway token
    # ----------------------------------------
    #- name: Debug controller templates variable
    #  include_vars:
    #    file: /home/exporttest/flatexport/controller_job_templates.yaml
    #- name: anothertest
    #  ansible.builtin.debug:
    #    var: controller_templates

    - name: Lookup Default organization
      uri:
        url: "{{ aap_hostname }}/api/controller/v2/organizations/?name=Default"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
      register: org_resp

    - set_fact:
        default_org_id: "{{ org_resp.json.results[0].id }}"

    - name: Check if OAuth Application exists
      uri:
        url: "{{ aap_hostname }}/api/gateway/v1/applications/?name={{ oauth_app_name }}"
        method: GET
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
      register: app_lookup

    - name: Create OAuth Application if missing
      uri:
        url: "{{ aap_hostname }}/api/gateway/v1/applications/"
        method: POST
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        body_format: json
        status_code: 201
        body:
          name: "{{ oauth_app_name }}"
          description: "Application for imports"
          client_type: confidential
          authorization_grant_type: password
          organization: "{{ default_org_id }}"
      when: app_lookup.json.count|int == 0
      register: app_created

    - set_fact:
        app_id: "{{ (app_lookup.json.results[0].id
                     if (app_lookup.json.count|int) > 0
                     else app_created.json.id) }}"

    - name: Load existing token file if present
      slurp:
        src: "{{ token_file }}"
      register: token_slurp
      ignore_errors: yes

    - set_fact:
        token_data: "{{ token_slurp.content | b64decode | from_json }}"
      when: token_slurp is defined and token_slurp.content is defined
      ignore_errors: yes

    - name: Refresh token if refresh_token present
      uri:
        url: "{{ aap_hostname }}/api/gateway/v1/tokens/refresh/"
        method: POST
        body_format: json
        status_code: 200
        headers:
          Content-Type: application/json
        body:
          refresh_token: "{{ token_data.refresh_token }}"
      when: token_data is defined and token_data.refresh_token is defined
      register: token_refreshed
      failed_when: false

    - name: Create a new write token if refresh missing/failed
      uri:
        url: "{{ aap_hostname }}/api/gateway/v1/tokens/"
        method: POST
        user: "{{ aap_username }}"
        password: "{{ aap_password }}"
        force_basic_auth: true
        validate_certs: "{{ aap_validate_certs }}"
        body_format: json
        status_code: 201
        body:
          application: "{{ app_id }}"
          description: "Import automation token"
          scope: "write"
      when: token_refreshed is not defined or token_refreshed.json.access_token is not defined
      register: token_new

    - name: Pick active token values
      set_fact:
        aap_oauthtoken: >-
          {{ (token_refreshed.json.access_token
              if (token_refreshed is defined and token_refreshed.json.access_token is defined)
              else token_new.json.token) }}
        aap_refresh_token: >-
          {{ (token_refreshed.json.refresh_token
              if (token_refreshed is defined and token_refreshed.json.refresh_token is defined)
              else token_new.json.refresh_token) }}

    - name: Save access/refresh tokens to file
      copy:
        dest: "{{ token_file }}"
        content: "{{ {'access_token': aap_oauthtoken,
                     'refresh_token': aap_refresh_token } | to_nice_json }}"
        mode: '0600'

